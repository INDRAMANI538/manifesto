<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Manifesto — Your personal goal command center. Plan by weeks, track progress, and crush your ambitions with style." />
  <meta name="theme-color" content="#0a0e1a" />
  <title>Manifesto — Goal Planner</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="app">
    <!-- Ambient background effects -->
    <div class="ambient-bg">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>

    <!-- Header -->
    <header class="app-header" id="app-header">
      <div class="header-left">
        <div class="logo">
          <div class="logo-icon">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
              <path d="M14 2L4 8v12l10 6 10-6V8L14 2z" stroke="url(#logo-grad)" stroke-width="2" fill="none" />
              <path d="M14 8l-5 3v6l5 3 5-3v-6l-5-3z" fill="url(#logo-grad)" opacity="0.3" />
              <path d="M14 11l-3 1.8v3.4l3 1.8 3-1.8v-3.4l-3-1.8z" fill="url(#logo-grad)" />
              <defs>
                <linearGradient id="logo-grad" x1="4" y1="2" x2="24" y2="26" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#00d4ff" />
                  <stop offset="1" stop-color="#7c3aed" />
                </linearGradient>
              </defs>
            </svg>
          </div>
          <h1 class="logo-text">MANIFESTO</h1>
        </div>
      </div>
      <div class="header-right">
        <div class="search-container" id="search-container">
          <button class="icon-btn search-toggle" id="search-toggle" aria-label="Toggle search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.35-4.35" />
            </svg>
          </button>
          <input type="text" class="search-input" id="search-input" placeholder="Search goals..." />
        </div>
        <button class="btn btn-primary" id="add-week-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 5v14M5 12h14" />
          </svg>
          <span>New Week</span>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="app-main" id="app-main">
      <!-- Dashboard -->
      <section class="dashboard" id="dashboard"></section>

      <!-- Week Navigator -->
      <section class="week-navigator" id="week-navigator"></section>

      <!-- Week Board -->
      <section class="week-board" id="week-board"></section>
    </main>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal" id="modal"></div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
